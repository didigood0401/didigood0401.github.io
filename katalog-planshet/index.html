<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1720">
<title>Каталог для планшета - демо</title>
<style>
:root{--bg:#f4f2ee;--panel:#fff;--ink:#16191d;--muted:#6b7077;--line:#e4e0d8;--acc:#1f6f5c;--acc2:#e8f1ee;--side:#0f1720;--sideInk:#c9d1d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px}
.note{position:fixed;top:10px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted)}
.tablet{width:min(1180px,100%);aspect-ratio:4/3;max-height:calc(100vh - 60px);background:#111;border-radius:34px;padding:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
.app{width:100%;height:100%;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:260px 1fr;background:var(--bg)}
aside{background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;padding:0 8px 22px}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3fb391,#1f6f5c);display:block}
.sec{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;font-size:15px;transition:background .2s}
.sec svg{width:22px;height:22px;flex:none;opacity:.8}
.sec.on{background:#1d2a36;color:#fff}
.sec:active{transform:scale(.98)}
.side-foot{margin-top:auto;font-size:12px;opacity:.6;padding:0 8px}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:18px 26px;border-bottom:1px solid var(--line);background:var(--panel)}
.back{all:unset;cursor:pointer;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc2);color:var(--acc);visibility:hidden}
.back.show{visibility:visible}
.crumbs{font-size:14px;color:var(--muted)}
.crumbs b{color:var(--ink);font-size:20px;display:block;font-weight:650}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:9px 14px;width:240px;color:var(--muted)}
.search input{all:unset;width:100%;font-size:15px;color:var(--ink)}
.view{flex:1;overflow:auto;padding:24px 26px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{all:unset;cursor:pointer;background:var(--panel);border-radius:18px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.97)}
.ph{aspect-ratio:4/3;display:grid;place-items:center;color:#fff;font-weight:700;font-size:40px;letter-spacing:-1px}
.card .t{padding:14px 16px 4px;font-weight:600}
.card .s{padding:0 16px 16px;color:var(--muted);font-size:14px}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:start}
.detail .ph{border-radius:20px;font-size:72px}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumbs span{flex:1;aspect-ratio:1;border-radius:12px;opacity:.55}
.thumbs span.on{opacity:1;outline:3px solid var(--acc);outline-offset:2px}
.detail h2{margin:0 0 8px;font-size:28px;line-height:1.15}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;margin-bottom:14px}
.specs{margin:18px 0;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.specs span{color:var(--muted)}
.btn{all:unset;cursor:pointer;background:var(--acc);color:#fff;padding:14px 22px;border-radius:14px;font-weight:600}
.fade{animation:f .28s ease-out}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:820px){body{padding:0}.tablet{border-radius:0;padding:0;aspect-ratio:auto;height:100vh;max-height:none}.app{border-radius:0;grid-template-columns:76px 1fr}.sec span,.brand b,.side-foot{display:none}.detail{grid-template-columns:1fr}.search{width:150px}.note{display:none}}
</style>
</head>
<body>
<div class="note">Демо: каталог «Раздел - подраздел - описание» для планшета. Работает офлайн, собирается в APK для RuStore.</div>
<div class="tablet"><div class="app">
  <aside>
    <div class="brand"><i></i><b>Каталог</b></div>
    <nav id="nav"></nav>
    <div class="side-foot">Демо-версия · контент условный</div>
  </aside>
  <main>
    <header>
      <button class="back" id="back" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Поиск по каталогу"></label>
    </header>
    <div class="view" id="view"></div>
  </main>
</div></div>
<script>
const I={
 a:'<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/>',
 b:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
 c:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
 d:'<path d="M4 7h16M4 12h16M4 17h10"/>'};
const C=['#1f6f5c','#2d5d8a','#8a5a2d','#6a3d7a','#3d6b2d','#7a2d3d','#2d7a78','#5a5f2d'];
const D=[
 {id:'a',name:'Оборудование',icon:'a',subs:[
  {name:'Насосы',items:['Насос ЦН-40','Насос ЦН-65','Насос дозировочный НД-10']},
  {name:'Компрессоры',items:['Компрессор КП-200','Компрессор винтовой КВ-15']},
  {name:'Ёмкости',items:['Ёмкость 5 м³','Ёмкость 10 м³','Ёмкость 25 м³']}]},
 {id:'b',name:'Материалы',icon:'b',subs:[
  {name:'Покрытия',items:['Грунт ГФ-021','Эмаль ПФ-115']},
  {name:'Изоляция',items:['Минвата 50 мм','Пенополиуретан ППУ-60']}]},
 {id:'c',name:'Услуги',icon:'c',subs:[
  {name:'Монтаж',items:['Монтаж под ключ','Шеф-монтаж']},
  {name:'Сервис',items:['Плановое ТО','Выездной ремонт']}]},
 {id:'d',name:'О компании',icon:'d',subs:[
  {name:'Документы',items:['Сертификаты','Реквизиты']},
  {name:'Контакты',items:['Офис продаж','Склад']}]}];
let st={s:0,sub:null,item:null};
const $=id=>document.getElementById(id);
function col(t){let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;return C[h%C.length]}
function ph(t,big){const c=col(t);return `<div class="ph" style="background:linear-gradient(135deg,${c},${c}cc 60%,#0f1720)">${t.split(' ')[0].slice(0,2)}</div>`}
function nav(){ $('nav').innerHTML=D.map((s,i)=>`<button class="sec ${i==st.s?'on':''}" data-i="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[s.icon]}</svg><span>${s.name}</span></button>`).join('');
 document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{st={s:+b.dataset.i,sub:null,item:null};$('q').value='';render()})}
function render(){
 nav(); const S=D[st.s]; const v=$('view'); v.className='view fade'; void v.offsetWidth;
 $('back').classList.toggle('show',st.sub!==null);
 if(st.sub===null){
  $('crumbs').innerHTML=`Раздел<b>${S.name}</b>`;
  v.innerHTML=`<div class="grid">${S.subs.map((u,i)=>`<button class="card" data-u="${i}">${ph(u.name)}<div class="t">${u.name}</div><div class="s">${u.items.length} позиции</div></button>`).join('')}</div>`;
  v.querySelectorAll('.card').forEach(c=>c.onclick=()=>{st.sub=+c.dataset.u;render()});
 } else if(st.item===null){
  const U=S.subs[st.sub]; $('crumbs').innerHTML=`${S.name} / подраздел<b>${U.name}</b>`;
  v.innerHTML=`<div class="grid">${U.items.map((t,i)=>`<button class="card" data-k="${i}">${ph(t)}<div class="t">${t}</div><div class="s">Подробнее</div></button>`).join('')}</div>`;
  v.querySelectorAll('.card').forEach(c=>c.onclick=()=>{st.item=+c.dataset.k;render()});
 } else {
  const U=S.subs[st.sub],t=U.items[st.item]; $('crumbs').innerHTML=`${S.name} / ${U.name}<b>${t}</b>`;
  v.innerHTML=`<div class="detail"><div>${ph(t,1)}<div class="thumbs">${[0,1,2,3].map(n=>`<span class="${n?'':'on'}" style="background:${C[(n+st.item)%C.length]}"></span>`).join('')}</div></div>
  <div><span class="tag">${U.name}</span><h2>${t}</h2><p>Описание позиции: назначение, преимущества и особенности. Текст, фото и характеристики берутся из вашего контента - меняются без пересборки приложения.</p>
  <div class="specs"><div><span>Артикул</span>${1000+st.item*37}</div><div><span>Исполнение</span>Стандарт</div><div><span>Гарантия</span>24 мес.</div><div><span>Наличие</span>На складе</div></div>
  <button class="btn" onclick="alert('Здесь может быть заявка, звонок или PDF-буклет')">Запросить предложение</button></div></div>`;
  v.querySelectorAll('.thumbs span').forEach(s=>s.onclick=()=>{v.querySelectorAll('.thumbs span').forEach(x=>x.classList.remove('on'));s.classList.add('on');v.querySelector('.detail .ph').style.background=s.style.background});
 }
}
$('back').onclick=()=>{if(st.item!==null)st.item=null;else st.sub=null;render()};
$('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q){render();return}
 const r=[];D.forEach((s,si)=>s.subs.forEach((u,ui)=>u.items.forEach((t,ti)=>{if(t.toLowerCase().includes(q))r.push({si,ui,ti,t,p:s.name+' / '+u.name})})));
 $('crumbs').innerHTML=`Поиск<b>Найдено: ${r.length}</b>`;$('back').classList.remove('show');
 $('view').innerHTML=r.length?`<div class="grid">${r.map((x,i)=>`<button class="card" data-i="${i}">${ph(x.t)}<div class="t">${x.t}</div><div class="s">${x.p}</div></button>`).join('')}</div>`:'<div class="empty">Ничего не найдено</div>';
 $('view').querySelectorAll('.card').forEach(c=>c.onclick=()=>{const x=r[+c.dataset.i];st={s:x.si,sub:x.ui,item:x.ti};e.target.value='';render()})};
render();
</script>
</body>
</html>
