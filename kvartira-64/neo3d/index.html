<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Неоклассика · Квартира 64,5 м² в 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{--ink:#14110d;--paper:#f7f3ec;--gold:#c49a55;--glass:rgba(20,17,13,.42)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14110d;color:var(--paper);font:15px/1.5 "Golos Text",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;padding:calc(18px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) 40px max(22px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;gap:20px;background:linear-gradient(rgba(20,17,13,.55),transparent);pointer-events:none}
.top h1{margin:0;font:500 clamp(26px,3vw,40px)/1 "Cormorant Garamond",serif;letter-spacing:.3px}
.top h1 i{color:var(--gold)}
.top p{margin:6px 0 0;font-size:13px;opacity:.8;letter-spacing:.06em}
.top a{pointer-events:auto;color:var(--paper);font-size:13px;opacity:.85;text-decoration:none;border-bottom:1px solid rgba(196,154,85,.7);padding-bottom:2px;white-space:nowrap}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.bar button{flex:none;font:500 13.5px "Golos Text",sans-serif;color:var(--paper);background:none;border:0;padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:rgba(255,255,255,.1)}
.bar button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.bar .sep{width:1px;background:rgba(255,255,255,.2);margin:6px 2px;flex:none}
.hint{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom));font-size:12.5px;opacity:.8;text-align:right;background:var(--glass);backdrop-filter:blur(10px);padding:8px 12px;border-radius:10px;max-width:260px}
.move{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:calc(84px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px}
.move button{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:var(--glass);backdrop-filter:blur(10px);color:#fff;font-size:22px;touch-action:none}
@media (pointer:coarse){.move{display:flex}.hint .kb{display:none}}
body:not([data-mode="walk"]) .move{opacity:.55}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#14110d;z-index:10;transition:opacity 1s}
body.loaded #loader{opacity:0;pointer-events:none}
#loader div{width:min(320px,70vw);text-align:center}
#loader h2{font:500 34px "Cormorant Garamond",serif;margin:0 0 16px}
#loader .track{height:2px;background:rgba(255,255,255,.15);overflow:hidden}
#bar{height:100%;width:0;background:var(--gold);transition:width .3s}
#loader small{display:block;margin-top:10px;opacity:.7;font-size:12.5px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:640px){.hint{display:none}.top p{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body data-mode="tour">
<div id="stage"></div>

<header class="top">
 <div><h1>Неоклассика · <i>64,5 м²</i></h1><p>КУХНЯ-ГОСТИНАЯ 29,9 · СПАЛЬНЯ 16,4 · ВАННАЯ · ТУАЛЕТ</p></div>
 <a href="../neoklassika/">описание и материалы</a>
</header>

<nav class="bar" aria-label="Навигация по квартире">
 <button id="tourBtn" aria-pressed="true">▶ Экскурсия</button><span class="sep"></span>
 <button data-room="living">Гостиная</button><button data-room="kitchen">Кухня</button><button data-room="bedroom">Спальня</button><button data-room="bath">Ванная</button><button data-room="wc">Туалет</button><button data-room="hall">Прихожая</button>
</nav>

<div class="hint"><span class="kb">Тяните мышью - осмотреться,<br>W A S D или стрелки - идти.</span></div>
<div class="move" aria-hidden="true"><button data-hold="KeyW">▲</button><button data-hold="KeyS">▼</button></div>

<div id="loader"><div><h2>Открываем квартиру</h2><div class="track"><div id="bar"></div></div><small id="loadTxt">0%</small></div></div>

<script type="module" src="main.js"></script>
</body>
</html>
