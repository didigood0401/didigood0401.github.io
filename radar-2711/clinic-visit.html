<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>С чего начать визит?</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#32495a"><header><b>Форма / стоматология</b><small>Рабочее демо</small></header><main><section class="intro"><h1>С чего начать визит?</h1><p>Прототип первого экрана стоматологии. Первое действие пациента определяет, какой следующий шаг покажет страница.</p></section><section class="grid"><div class="panel"><h2>Выберите сценарий</h2><div class="rail" id="choices"></div><p class="call" id="lead"></p></div><article aria-live="polite"><small id="tag"></small><h2 id="head"></h2><p id="body"></p><div class="tbl"><span id="k"></span><b id="v"></b></div><p id="end"></p></article></section></main><footer>Демо маршрутов записи. Медицинские услуги, контакты и расписание подставляются после согласования с клиникой.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const rec=[["Первый визит", "Пациент ещё не выбрал врача и хочет понять порядок первого приёма.", "Первичное обращение", "Запланировать консультацию", "На приёме врач уточнит жалобы, проведёт осмотр и объяснит следующие шаги. Выберите удобную клинику и сообщите администратору предпочтительное время.", "Заявка", "Консультация", "В форме достаточно имени, способа связи и согласия. Медицинские детали обсуждаются с врачом."], ["Есть план лечения", "У пациента есть документы, их не нужно публиковать в заявке.", "Повторное обращение", "Обсудить план с врачом", "Администратор согласует специальность и время. Перечень нужных документов клиника пришлёт при подтверждении.", "Заявка", "Разбор плана", "При реализации обращения попадают в разные очереди администраторов."], ["Уже записан", "Быстрый путь для посетителя, который уже выбрал клинику.", "Действующая запись", "Уточнить время посещения", "Для переноса записи администратор проверяет данные через согласованный канал. На публичной странице расписание конкретных пациентов не показывается.", "Заявка", "Связь с администратором", "Этот маршрут ведёт напрямую к контактам выбранного филиала."]];const nav=$('choices');function draw(i){const r=rec[i];[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));['lead','tag','head','body','k','v','end'].forEach((id,j)=>$(id).textContent=r[j+1])}rec.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r[0];b.onclick=()=>draw(i);nav.append(b)});draw(0);</script></body></html>
