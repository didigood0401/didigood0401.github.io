<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Комплектация дома</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#3c503a"><header><b>Север / каркас</b><small>Рабочее демо</small></header><main><section class="intro"><h1>Комплектация дома</h1><p>Сравните комплектации по площади и увидите, какие работы входят в расчёт.</p></section><section class="grid"><div class="panel"><h2>Параметры расчёта</h2><label>Комплектация<select id="model"></select></label><label>Площадь дома, м²<input type="number" id="qty" min="1" max="10000" value="1"></label><div id="opts"></div></div><article aria-live="polite"><h2>Расчёт по строкам</h2><div class="metric" id="total"></div><div id="lineitems"></div><p class="call" id="next"></p><button id="print">Распечатать расчёт</button></article></section></main><footer>Учебные расценки за квадратный метр. Фундамент и доставка согласуются по участку.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const steps=[["Тёплый контур", 38000, "В примере учтены стены, утепление, окна и контур кровли."], ["Дом с отделкой", 58000, "В примере включены внутренние покрытия и базовая электрика."]],opts=[["Терраса", 180000, false], ["Водосточная система", 96000, false]];for(const [i,r] of steps.entries())$('model').add(new Option(r[0],i));for(const [i,r] of opts.entries()){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=i;l.append(c,' '+r[0]);$('opts').append(l)}function draw(){const q=$('qty').valueAsNumber,model=steps[$('model').selectedIndex];$('lineitems').replaceChildren();if(!Number.isInteger(q)||q<1||q>10000){$('total').textContent='Проверьте количество';$('next').textContent='Введите целое число от 1 до 10 000.';return}let sum=0;const append=(s,v)=>{sum+=v;const d=document.createElement('div'),b=document.createElement('b');d.className='tbl';d.textContent=s;b.textContent=fmt(v)+' ₽';d.append(b);$('lineitems').append(d)};append(model[0]+' × '+q,model[1]*q);for(const c of $('opts').querySelectorAll('input:checked')){const r=opts[Number(c.value)];append(r[0],r[1]*(r[2]?q:1))}$('total').textContent=fmt(sum)+' ₽';$('next').textContent=model[2]}document.querySelector('.grid').addEventListener('input',draw);$('print').onclick=()=>window.print();draw();</script></body></html>
