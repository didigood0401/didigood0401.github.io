<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отчёт владельцу — посуточная аренда</title><link rel="stylesheet" href="practice27.css"><header><b>Отчёт владельцу</b><small>Демо · посуточная аренда</small></header><main><section class="intro"><h1>Доход за месяц</h1><p>Измените выручку, расходы и долю управляющей. Суммы автоматически попадут в отчёт для собственника.</p></section><section class="panel"><div id="fields"></div><div class="rail"><b id="total" aria-live="polite"></b></div><button id="export">Скачать отчёт CSV</button></section></main><style>#fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}input{width:100%}#total{font-size:20px;margin:18px 0;white-space:pre-line}</style><script>const fields=[['gross','Оплаты гостей, ₽',128000],['fee','Комиссии площадок, ₽',12000],['clean','Уборка и бельё, ₽',9800],['other','Другие расходы, ₽',3600],['pct','Доля управляющей, %',25]];const el=id=>document.getElementById(id),money=v=>v.toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';for(const [id,title,v]of fields){const l=document.createElement('label'),b=document.createElement('input');b.type='number';b.min='0';b.step='0.01';if(id==='pct')b.max='100';b.id=id;b.value=v;b.oninput=update;l.textContent=title;l.append(b);el('fields').append(l)}function calculate(){if(fields.some(([id])=>!el(id).value||!el(id).validity.valid))return null;const [g,f,c,o,p]=fields.map(([id])=>Number(el(id).value)),net=g-f-c-o,manager=Math.round(Math.max(net,0)*p)/100;return [['Чистый доход',net],['Управляющей',manager],['Собственнику',net-manager]]}function update(){const r=calculate();el('total').textContent=r?r.map(([n,v])=>n+' — '+money(v)).join('\n'):'Проверьте суммы и процент от 0 до 100.';el('export').disabled=!r}el('export').onclick=()=>{const d=calculate();if(!d)return;const rows=[['Показатель','Значение'],...fields.map(([id,n])=>[n,el(id).value]),...d];const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(row=>row.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='rental-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)};update()</script></html>
