<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Промышленная графика</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#164353"><header><b>Цех / серия открыток</b><small>Рабочее демо</small></header><main><section class="intro"><h1>Промышленная графика</h1><p>Проверьте одну систему оформления на двух профессиональных праздниках. Меняются графика, заголовок и цвет.</p></section><section class="grid"><div class="panel"><h2>Макет носителя</h2><label>Направление<select id="concept"></select></label><label>Формат<select id="ratio"><option>Вертикальный</option><option>Квадрат</option><option>Горизонтальный</option></select></label><label>Основная строка<input id="name" maxlength="36"></label><label>Вторая строка<input id="caption" maxlength="55"></label><div class="rail"><button id="download">Сохранить PNG</button></div></div><article><h2>Предпросмотр</h2><canvas id="poster" style="width:100%;height:auto;max-height:520px;object-fit:contain" aria-label="Предпросмотр носителя"></canvas></article></section></main><footer>Экранные образцы для согласования композиции. PNG сохраняется в выбранной пропорции.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const variants=[["Машиностроение", "День машиностроителя", "Тем, кто создаёт движение", "#14394a", "#84bdce", "#f7eedc", "arc", "ИНЖЕНЕРНАЯ СЕРИЯ"], ["Энергетика", "День энергетика", "Тем, кто даёт городам свет", "#222b39", "#dbb672", "#fff1d8", "step", "ИНЖЕНЕРНАЯ СЕРИЯ"]];const sel=$('concept');variants.forEach((r,i)=>sel.add(new Option(r[0],i)));const canvas=$('poster'),g=canvas.getContext('2d');function write(s,x,y,max,px,style,color){g.fillStyle=color;do{g.font=style+' '+px+'px Georgia,serif';if(g.measureText(s).width<=max)break;px-=2}while(px>14);g.fillText(s,x,y)}function paint(){const a=variants[sel.selectedIndex],dim=[[1080,1350],[1080,1080],[1600,900]][$('ratio').selectedIndex],[w,h]=dim;canvas.width=w;canvas.height=h;g.fillStyle=a[3];g.fillRect(0,0,w,h);g.save();g.beginPath();g.rect(0,0,w,h*.62);g.clip();g.strokeStyle=a[4];g.lineWidth=w*.009;const x=w*.72,y=h*.16;for(let i=0;i<11;i++){g.beginPath();if(a[6]==='arc'){let r=w*(.07+i*.035);g.arc(x,y,r,.08*Math.PI,1.8*Math.PI)}else if(a[6]==='step'){const z=w*(.05+i*.037);g.moveTo(x-z,y+z);g.lineTo(x-z,y);g.lineTo(x,y);g.lineTo(x,y-z);g.lineTo(x+z,y-z)}else{let z=w*(.06+i*.033);g.moveTo(x-z,y-z);g.bezierCurveTo(x+z,y-z,x-z,y+z,x+z,y+z)}g.stroke()}g.restore();g.fillStyle=a[5];g.font='bold '+Math.round(w*.027)+'px Arial';g.fillText(a[7],w*.075,h*.12);write($('name').value,w*.075,h*.77,w*.85,Math.round(w*.105),'bold',a[5]);write($('caption').value,w*.077,h*.85,w*.85,Math.round(w*.043),'normal',a[5]);g.fillStyle=a[4];g.fillRect(w*.077,h*.91,w*.23,Math.max(3,w*.004))}function load(){const a=variants[sel.selectedIndex];$('name').value=a[1];$('caption').value=a[2];paint()}sel.onchange=load;$('ratio').onchange=paint;$('name').oninput=paint;$('caption').oninput=paint;$('download').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL();a.download='design-'+canvas.width+'x'+canvas.height+'.png';a.click()};load();</script></body></html>
