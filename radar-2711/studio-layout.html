<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявка в студию</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#3b3c52"><header><b>Mira / interaction</b><small>Рабочее демо</small></header><main><section class="intro"><h1>Заявка в студию</h1><p>Фрагмент адаптивного лендинга: посетитель выбирает тип проекта, проходит в форму и получает понятный результат.</p></section><section class="grid"><div class="panel"><h2>Выберите сценарий</h2><div class="rail" id="choices"></div><p class="call" id="lead"></p></div><article aria-live="polite"><small id="tag"></small><h2 id="head"></h2><p id="body"></p><div class="tbl"><span id="k"></span><b id="v"></b></div><p id="end"></p></article></section><div class="rail"><button id="launch">Обсудить проект</button></div><dialog id="dlg" style="border:1px solid #aaa;border-radius:12px;max-width:90vw"><form id="brief"><h2>Короткий бриф</h2><label>О задаче<textarea id="goal" required minlength="5"></textarea></label><div class="rail"><button type="submit">Проверить бриф</button><button id="cancel" type="button">Закрыть</button></div><p id="feedback" role="status"></p></form></dialog></main><footer>Демонстрация взаимодействия. Данные в демо не отправляются.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const rec=[["Новый проект", "Посетитель впервые обращается в студию.", "Бриф", "Расскажите о задаче", "В заявке важно зафиксировать цель, количество экранов и целевую дату. Подробный бриф можно собрать после согласования.", "Следующий шаг", "Короткая форма", "Обязательные поля отмечены в самой форме."], ["Готовый макет", "Для оценки вёрстки уже есть макет и список состояний.", "Передача в разработку", "Передать макет", "Для расчёта потребуются ссылка для просмотра, мобильная версия и состояния форм.", "Следующий шаг", "Оценка по макету", "Материалы остаются у команды."]];const nav=$('choices');function draw(i){const r=rec[i];[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));['lead','tag','head','body','k','v','end'].forEach((id,j)=>$(id).textContent=r[j+1])}rec.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r[0];b.onclick=()=>draw(i);nav.append(b)});draw(0);</script><script>launch.onclick=()=>{dlg.showModal();goal.focus()};cancel.onclick=()=>dlg.close();brief.onsubmit=e=>{e.preventDefault();feedback.textContent='Бриф заполнен. Демо не отправляет данные в студию.'};dlg.onclose=()=>launch.focus();</script></body></html>
