<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Одна новость, три формата</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#65433b"><header><b>Выпуск / редакция</b><small>Рабочее демо</small></header><main><section class="intro"><h1>Одна новость, три формата</h1><p>Редакционная проба для пресс-службы. Откройте формат, чтобы сравнить подачу одного события на сайте, в соцсети и в эфире.</p></section><section class="grid"><div class="panel"><h2>Выберите сценарий</h2><div class="rail" id="choices"></div><p class="call" id="lead"></p></div><article aria-live="polite"><small id="tag"></small><h2 id="head"></h2><p id="body"></p><div class="tbl"><span id="k"></span><b id="v"></b></div><p id="end"></p></article></section></main><footer>Учебный инфоповод. Дата, площадка и условия требуют подтверждения перед реальной публикацией.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const rec=[["Сайт", "Сначала подтвердить дату у координатора и получить согласование программы.", "Новость на сайте", "В мастерской открывают день диагностики", "В субботу мастерская выделит часы для открытой диагностики велосипедов. Механики покажут, как проверить тормоза и состояние цепи перед поездкой. Посетители смогут задать вопросы и записаться на осмотр.", "Перед выпуском", "Адрес и время", "Добавить ссылку на запись и условия участия."], ["Соцсеть", "Для фотографии — общий план осмотра, без лиц посетителей без согласия.", "Анонс сообщества", "Когда вы в последний раз проверяли тормоза?", "В субботу разберём велосипед вместе с механиком. Покажем три точки проверки перед выездом и ответим на вопросы. Запись откроем после подтверждения времени.", "Формат", "Пост и 1 фото", "После публикации закрепить ответ с временем и местом."], ["Радио", "Проверить произношение адреса и убрать URL из текста ведущего.", "Текст для ведущего", "В субботу — открытая мастерская", "Как проверить велосипед перед поездкой? В субботу механики покажут, на что обратить внимание в тормозах и цепи. Узнать время открытой мастерской и записаться на осмотр можно на сайте организатора.", "Хронометраж", "Около 15 секунд", "Перед эфиром — контрольное чтение в темпе ведущего."]];const nav=$('choices');function draw(i){const r=rec[i];[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));['lead','tag','head','body','k','v','end'].forEach((id,j)=>$(id).textContent=r[j+1])}rec.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r[0];b.onclick=()=>draw(i);nav.append(b)});draw(0);</script></body></html>
