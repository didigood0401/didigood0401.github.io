<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf6"><title>Babloo — библиотека пиктограмм</title><style>
*{box-sizing:border-box}body{--bg:#faf9f6;--fg:#141411;--panel:#fff;--line:#dcdad4;--mut:#5c5a54;--soft:#edece6;margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Inter,Arial,sans-serif}body.dark{--bg:#121311;--fg:#f7f7f1;--panel:#1d1f1c;--line:#464842;--mut:#c3c4b9;--soft:#292c27}.wrap{max-width:1120px;margin:auto;padding:0 clamp(18px,5vw,70px)}header{border-bottom:1px solid var(--line)}header .wrap,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.word{font-size:29px;font-weight:850;letter-spacing:-2px}header .wrap{padding-block:16px}button,a,select{font:inherit;color:inherit}button,select{cursor:pointer;background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:9px}button:focus-visible,select:focus-visible{outline:3px solid #7299d4;outline-offset:3px}.hero{border-bottom:1px solid var(--line);padding:45px 0 32px}.hero h1{margin:0;font-size:clamp(39px,6vw,74px);letter-spacing:-.065em;line-height:1.05}.hero p{font-size:18px;color:var(--mut);max-width:650px;margin:14px 0 0}main{padding-bottom:50px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.8fr);gap:28px;margin-top:28px}h2{font-size:20px;letter-spacing:-.04em;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 26px}nav button{font-size:14px}.icons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{min-height:96px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:14px;line-height:1.2}.tile[aria-pressed=true],nav button[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}.tile svg{width:30px;height:30px}.inspector{align-self:start;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:19px}.preview{height:166px;display:grid;place-items:center;background:var(--soft);border-radius:8px;margin:15px 0}.preview svg{width:92px;height:92px}.meta{color:var(--mut);font-size:14px}.phone{display:flex;align-items:center;gap:11px;min-height:62px;border-block:1px solid var(--line);margin:12px 0 16px}.primary{width:100%;background:var(--fg);color:var(--bg);font-weight:650}.foot{margin-top:24px;color:var(--mut);font-size:14px}.inspector h2{margin-top:2px}.row label{font-size:14px}select{padding:5px;width:78px}.heading{margin:16px 0 9px}@media(max-width:740px){.layout{grid-template-columns:1fr}.hero{padding:28px 0 22px}.icons{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{min-height:78px}.inspector{max-width:none}.preview{height:95px}.preview svg{width:62px;height:62px}}
</style><header><div class="wrap"><b class="word">babloo</b><button id="theme" aria-pressed="false">Тёмный фон</button></div></header><main class="wrap"><section class="hero"><h1>Иконки услуг</h1><p>20 монохромных SVG для приложения. Выберите раздел и проверьте, как его услуги читаются в мобильном списке.</p></section><div class="layout"><section><h2>Разделы каталога</h2><nav aria-label="Категории" id="nav"></nav><div id="grid"></div><p class="foot">Демонстрационная выборка из четырёх разделов. Названия для итогового комплекта сверим с каталогом Babloo.</p></section><aside class="inspector"><span class="meta" id="role"></span><h2 id="name"></h2><div class="preview" id="big" aria-hidden="true"></div><div class="row"><label for="size">Размер в списке</label><select id="size"><option>16</option><option selected>24</option><option>32</option></select></div><div class="phone"><span id="small" aria-hidden="true" style="display:flex"></span><span id="label"></span></div><button class="primary" id="download">Скачать SVG</button></aside></div></main><script>
const groups=[["home","Быт","Услуги для дома","M3 11 12 3l9 8 M5.5 10v10h13V10 M10 20v-6h4v6",[["clean","Уборка","M5 21h12l-2-7H7z M11 14l5-11 M17 8l1-2 2-1-2-1-1-2-1 2-2 1 2 1z"],["windows","Мытьё окон","M3 3h13v15H3z M9 3v15 M3 9h13 M13 14l6-4 M15 13l5 7"],["chef","Повар","M6 14a4 4 0 0 1-1-7.8A4 4 0 0 1 12 5a4 4 0 0 1 7 2 3.8 3.8 0 0 1-1 7v5H6z M7 16h10 M10 10v3 M14 10v3"],["laundry","Химчистка","M3 5h18l-2 14H5z M5 11q2-2 4 0t4 0t4 0t3 0 M9 4V2 M15 4V2"]]],["beauty","Красота","Красота и уход","M14 4l6 6-9 9-6-6z M13 5l-3-2 M6 19l-3 2 2-4 M15 9l2 2",[["scissors","Стрижка","M4 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M10 20a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2z M6.5 14.5 20 4 M10 14.9 8 3 M11 11.2l1.2 2"],["polish","Маникюр","M9 3h6v7H9z M8 10h8l2 3v7H6v-7z M9 15h6"],["makeup","Макияж","M7 12V7l5-4v9 M6 12h8v9H6z M16 6l1-2 1 2 2 1-2 1-1 2-1-2-2-1z"],["brows","Брови","M2.5 11Q8 3 21 8l-3 .7Q9 7 3 13 M5 16q6 4 13-1 M7 17l-1 2 M11 17.7v2"]]],["repair","Ремонт","Ремонт и отделка","M4 19l9-9a5 5 0 0 1 6-6l-3 3 2 2 3-3a5 5 0 0 1-6 6l-9 9z",[["tiles","Укладка плитки","M3 3h8v8H3z M14 4l5-2 3 6-6 3z M3 14h8v7H3z M14 14h7v7h-7z"],["electric","Электрика","M9 3v5 M15 3v5 M6 8h12v3a6 6 0 0 1-5 5.8V21h-2v-4.2A6 6 0 0 1 6 11z"],["wallpaper","Поклейка обоев","M5 5a3 3 0 0 1 6 0v12a3 3 0 0 0-6 0z M5 17a3 3 0 0 0 3 3h12V7h-9 M14 12l2 2 2-2"],["plumbing","Сантехника","M3 10h13a4 4 0 0 1 4 4v2h-5v-2H3z M9 10V6 M5 5h9 M18 18q-3 3 0 4 3-1 0-4z"]]],["transport","Транспорт","Транспорт и доставка","M2.5 6h12v11h-3 M5 17H2.5 M14.5 10h4l3 4v3h-2 M7.5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M17.5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",[["courier","Доставка","M8 6l7-3 6 3-7 3z M8 6v9l6 3 7-3V6 M14 9v9 M2 9h3 M1 12h4 M3 15h2"],["boxes","Переезды","M3 9h18v11H3z M3 9l3-5h12l3 5 M12 4v9 M7 16h3"],["loading","Услуги грузчиков","M3 3h3l3.8 13H20 M10 19a1.5 1.5 0 1 0 .01 0 M18 19a1.5 1.5 0 1 0 .01 0 M9 5l8-2 2.5 9-8 2z"],["road","Помощь в дороге","M12 3l9 16H3z M12 9v4 M12 16v.2"]]]],el=id=>document.getElementById(id);let ix=0,sel;
function svg(d,size,color="currentColor"){return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"><path d="'+d+'"/></svg>'}
function choose(data,role){sel=data;el('name').textContent=data[1];el('label').textContent=data[1];el('role').textContent=role;el('big').innerHTML=svg(data[2],96);el('small').innerHTML=svg(data[2],Number(el('size').value));document.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===data[0])))}
function tile(data,role){const b=document.createElement('button');b.className='tile';b.dataset.id=data[0];b.innerHTML=svg(data[2],30)+'<span>'+data[1]+'</span>';b.onclick=()=>choose(data,role);return b}
function group(i){ix=i;const [id,short,name,d,subs]=groups[i],grid=el('grid');grid.replaceChildren();const top=[id,name,d];for(const [label,items] of [['Категория',[top]],['Подкатегории',subs]]){const h=document.createElement('h2');h.className='heading';h.textContent=label;grid.append(h);const box=document.createElement('div');box.className='icons';items.forEach(x=>box.append(tile(x,label==='Категория'?label:'Подкатегория')));grid.append(box)}[...el('nav').children].forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));choose(top,'Категория')}
groups.forEach((g,i)=>{const b=document.createElement('button');b.textContent=g[1];b.onclick=()=>group(i);el('nav').append(b)});el('size').onchange=()=>choose(sel,el('role').textContent);el('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');el('theme').textContent=dark?'Светлый фон':'Тёмный фон';el('theme').setAttribute('aria-pressed',String(dark))};el('download').onclick=()=>{const u=URL.createObjectURL(new Blob([svg(sel[2],24)],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=u;a.download='babloo-'+groups[ix][0]+'-'+sel[0]+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};group(0)
</script></html>
