<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Демонстрационный новогодний спецвыпуск: первая полоса, расследование и интервью."><title>Вечерняя утка — праздничный спецвыпуск</title><style>*{box-sizing:border-box}body{margin:0;background:#242824;color:#fff7e4;font:16px/1.4 Arial,sans-serif}header{background:#fbf5e7;color:#141613;border-bottom:5px solid #a82b26}.wrap{max-width:1100px;margin:auto;padding:14px clamp(14px,4vw,44px)}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:bold italic clamp(23px,4.2vw,48px)/1 Georgia,serif;color:#a32622}.pdf{display:inline-block;padding:9px 14px;border:1px solid currentColor;color:#35352d;font-weight:bold;text-decoration:none;font-size:14px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar p{margin:0;font-size:14px;color:#dfddcc}nav{display:flex;gap:5px;flex-wrap:wrap}nav a{padding:9px 12px;text-decoration:none;color:#f5f0de;border:1px solid #797a6c;font-size:14px}nav a[aria-current=page]{background:#f6cc59;color:#24241d;border-color:#f6cc59}figure{margin:0 auto 24px;max-width:780px;background:#f8f3e5;box-shadow:0 8px 48px #101410}figure img{width:100%;display:block;height:auto}a:focus-visible{outline:3px solid #e55833;outline-offset:3px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:550px){header .wrap{padding-block:14px}.bar{padding-block:12px;gap:7px}.bar p{font-size:13px}figure{margin-bottom:0}nav a{padding:6px 9px}}</style></head><body><header><div class="wrap"><span class="brand">Вечерняя утка</span><a class="pdf" href="Vechernyaya-utka-demo.pdf">Открыть PDF</a></div></header><main><h1 class="sr">Демонстрационный выпуск «Вечерняя утка»</h1><div class="bar wrap"><p>Новогодняя газета · вымышленная история · три полосы А4</p><nav aria-label="Полосы"><a href="#1">Обложка</a><a href="#2">Расследование</a><a href="#3">Интервью</a></nav></div><figure><a href="Vechernyaya-utka-demo.pdf" title="Открыть полосу в PDF"><img width="1191" height="1684" src="gazeta-1.webp" alt="Обложка. Два билета исчезли за минуту до сеанса!"></a></figure></main><script>const labels=['Обложка. Два билета исчезли за минуту до сеанса!','Расследование. След вёл к мандарину','Интервью. Последний ряд даёт показания'];function show(){const n=Number(location.hash.slice(1));const pg=[1,2,3].includes(n)?n:1;document.querySelector('img').src='gazeta-'+pg+'.webp';document.querySelector('img').alt=labels[pg-1];document.querySelector('figure a').href='Vechernyaya-utka-demo.pdf#page='+pg;document.querySelectorAll('nav a').forEach((a,i)=>{if(i===pg-1)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}onhashchange=show;show()</script></body></html>
