<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Две квартиры рядом</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#3b4b38"><header><b>Квадрат / подбор</b><small>Рабочее демо</small></header><main><section class="intro"><h1>Две квартиры рядом</h1><p>Сравните объекты по цене метра, отделке и бюджету покупки. Подборка пересчитывается без перезагрузки страницы.</p></section><section class="grid"><div class="panel"><h2>Подборка покупателя</h2><label>Первый объект<select id="a"></select></label><label>Второй объект<select id="b"></select></label><label>Бюджет, ₽<input id="budget" type="number" min="0" step="100000" value="15000000"></label></div><article aria-live="polite"><h2>Сравнение</h2><div id="compare"></div><p class="call" id="result"></p></article></section></main><footer>Объекты и стоимости вымышлены. Пример интерфейса для агентства недвижимости.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const flats=[['Набережная',62,14800000,'Чистовая'],['Парк',74,17200000,'Без отделки'],['Садовый квартал',54,12900000,'Предчистовая']];for(const id of ['a','b'])flats.forEach((r,i)=>$(id).add(new Option(r[0],i)));$('b').value=1;function run(){const a=flats[$('a').selectedIndex],b=flats[$('b').selectedIndex],lim=$('budget').valueAsNumber;const rows=[['Площадь',a[1]+' м² / '+b[1]+' м²'],['Цена',fmt(a[2])+' / '+fmt(b[2])+' ₽'],['За м²',fmt(Math.round(a[2]/a[1]))+' / '+fmt(Math.round(b[2]/b[1]))+' ₽'],['Отделка',a[3]+' / '+b[3]]];$('compare').replaceChildren();for(const [k,v] of rows){let d=document.createElement('div'),x=document.createElement('b');d.className='tbl';d.textContent=k;x.textContent=v;d.append(x);$('compare').append(d)}const pass=[...new Set([a,b])].filter(x=>x[2]<=lim).map(x=>x[0]);$('result').textContent=a===b?'Для сравнения выберите разные объекты.':!Number.isFinite(lim)||lim<0?'Введите бюджет покупки.':pass.length?'В бюджете: '+pass.join(', ')+'.':'Оба объекта превышают указанный бюджет.'}['a','b','budget'].forEach(id=>$(id).oninput=run);run()</script></body></html>
