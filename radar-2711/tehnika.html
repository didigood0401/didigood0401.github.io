<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аренда спецтехники · демонстрационная страница</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f6ef;color:#202321;font:16px/1.45 Arial,sans-serif}header{border-bottom:1px solid #bcbbae;display:flex;align-items:center;justify-content:space-between;padding:17px 5vw;font-weight:800}.mark{display:inline-block;background:#edbc42;padding:5px 9px;margin-right:9px}.demo{font-size:13px;font-weight:normal}main{max-width:1140px;margin:auto;padding:30px 4vw}nav{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;font:inherit}nav button{border:1px solid #a9a99e;border-radius:20px;padding:6px 13px;background:transparent}nav button[aria-pressed=true]{background:#26332d;color:white;border-color:#26332d}section{display:grid;grid-template-columns:1.3fr 1fr;align-items:stretch;gap:20px;margin:22px 0}article{background:#e5e3d7;border-top:6px solid #c09325;padding:clamp(18px,3vw,36px)}h1{font:800 clamp(32px,4.6vw,62px)/1.02 Arial;margin:12px 0}h2{font-size:24px;line-height:1.15;margin:4px 0 16px}.slug{font-size:12px;letter-spacing:2px;font-weight:bold}.spec{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #a4a698;margin-top:30px;padding-top:15px}.spec small,.spec b{display:block}.spec b{font-size:23px}.calc{background:#24372e;color:white;padding:clamp(18px,3vw,30px)}select,input{width:100%;padding:9px;margin-top:4px;font:inherit}label{display:block;margin:12px 0}.total{font-size:27px;color:#ffdb78;font-weight:bold}.action{padding:11px 15px;width:100%;margin-top:10px;background:#f0c551;border:0;color:#24221a;font-weight:bold}.details{border-top:1px solid #bcbbae;padding-top:16px}.details p{max-width:70ch}.note{font-size:13px;color:#576057}.calc small{display:block}.speak{color:#ffe6b0;margin-top:10px;font-size:14px}@media(max-width:680px){section{grid-template-columns:1fr}header{padding:12px}.demo{max-width:110px;text-align:right}}
</style><header><div><span class="mark">ТП</span> ТЕХПАРК</div><span class="demo">Демо сайта аренды</span></header>
<main><nav aria-label="Направления аренды"></nav><section><article><div class="slug">КАТАЛОГ ТЕХНИКИ</div><h1></h1><p id="desc"></p><div class="spec"><div><small>Характеристика</small><b id="spec"></b></div><div><small>Одна смена</small><b>8 часов</b></div></div></article><div class="calc"><h2>Рассчитать аренду</h2><label>Количество смен<input id="shifts" type="number" min="1" max="90" value="1"></label><label>Доставка на объект<select id="haul"><option value="0">Рассчитать отдельно</option><option value="4500">Условный тариф · 4 500 ₽</option></select></label><div class="total" aria-live="polite"></div><small>Предварительно, по демонстрационным ставкам.</small><button type="button" class="action">Собрать заявку</button><div class="speak" role="status"></div></div></section>
<div class="details"><h2>Что уточнит диспетчер</h2><p id="questions"></p><p class="note">В рабочей версии у каждого направления будет свой адрес для поиска и Директа. Здесь заявка формируется для просмотра.</p></div></main>
<script>
const items=[
['Экскаваторы','Аренда гусеничного экскаватора','Для котлованов, траншей и планировки грунта. Подбираем машину по глубине копания и возможности заезда.','Ковш 1,0 м³',24000,'Нужны адрес объекта, глубина и объём выемки, тип грунта и место для разгрузки трала.'],
['Автокраны','Аренда автокрана','Для разгрузки и монтажа. Грузоподъёмность подбираем с учётом вылета стрелы на площадке.','До 25 тонн',27000,'Нужны масса груза, радиус подачи, высота подъёма и размеры площадки для опор.'],
['Самосвалы','Аренда самосвала','Для вывоза грунта и доставки сыпучих материалов. Рассчитаем количество машин с учётом маршрута.','Кузов 16 м³',18000,'Нужны вид и объём материала, точки погрузки и выгрузки, ограничения на въезд.']];
let idx=0;const get=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
function count(){const n=get('#shifts').valueAsNumber;return Number.isInteger(n)&&n>=1&&n<=90?n:null}
function update(){const n=count();get('.total').textContent=n?money(items[idx][4]*n+Number(get('#haul').value)):'Укажите от 1 до 90 смен';get('.speak').textContent='';get('.action').disabled=!n}
function select(i){idx=i;const d=items[i];get('h1').textContent=d[1];get('#desc').textContent=d[2];get('#spec').textContent=d[3];get('#questions').textContent=d[5];document.querySelectorAll('nav button').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));update()}
items.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d[0];b.onclick=()=>select(i);get('nav').append(b)});get('#shifts').oninput=update;get('#haul').onchange=update;get('.action').onclick=()=>{get('.speak').textContent=items[idx][1]+'. Смен: '+count()+'. '+get('.total').textContent+'. '+(get('#haul').value==='0'?'Доставка отдельно.':'Доставка включена.')};select(0);
</script></html>
