<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Своя дорожка — тренировки по плаванию</title><style>*{box-sizing:border-box}body{margin:0;color:#102437;background:#f3f5f1;font:16px/1.45 Inter,Arial,sans-serif}main,header{max-width:1020px;margin:auto;padding:18px clamp(16px,4vw,45px)}header{display:flex;justify-content:space-between;align-items:center}a{color:#144b63}header b{letter-spacing:-.05em;font-size:25px}.hero{background:#003e55;color:white;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1.4fr .8fr}.copy{padding:clamp(22px,4vw,48px)}h1{font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:-.065em;margin:4px 0 16px}h2{letter-spacing:-.04em}.water{background:repeating-linear-gradient(104deg,transparent 0 35px,#a5fcffc4 35px 39px,transparent 40px 74px),repeating-linear-gradient(160deg,#197d9b 0 12px,#28879d 13px 25px,#19798d 27px 40px)}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin:18px 0}.card{background:white;padding:20px;border-radius:15px;border:1px solid #d2dddb}.card h2{margin:0 0 15px}.row{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #bacaca;background:white;color:#143447;padding:10px 13px;border-radius:8px}button[aria-pressed=true]{background:#004b61;color:white}.slots button{display:block;width:100%;text-align:left;margin:7px 0}.action{background:#143d4a;color:#fff;font-weight:650}.small{font-size:14px;color:#49616d}textarea{display:block;width:100%;border:1px solid #afc2c4;border-radius:7px;padding:10px;margin:8px 0}p{margin:9px 0 15px}button:focus-visible,textarea:focus-visible{outline:3px solid #e18128;outline-offset:2px}@media(max-width:650px){.layout{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.water{height:40px}.card{padding:16px}} </style><header><b>Своя дорожка</b><a href="#schedule">Расписание</a></header><main><section class="hero"><div class="copy"><h1>Плавать<br>в своём темпе</h1><p>Индивидуальные занятия для детей и взрослых. На первой тренировке определим комфортную нагрузку и выберем цель.</p></div><div class="water" aria-hidden="true"></div></section><div class="layout" id="schedule"><section class="card"><h2>Выберите занятие</h2><div id="levels" class="row"></div><p id="service"></p><div class="slots" id="slots"></div></section><section class="card"><h2>Ваша запись</h2><p id="summary" aria-live="polite"></p><button type="button" id="book" class="action">Проверить запись</button><p id="result" class="small" aria-live="polite"></p><p class="small">Демонстрационные слоты и цены. Данные остаются в браузере.</p></section></div><section class="card"><h2>Отзывы о занятиях</h2><label for="review">Оставить отзыв для тренера</label><textarea id="review" maxlength="700" rows="2"></textarea><button id="submit">Отправить на модерацию</button><p id="message" class="small" role="status"></p></section></main><script>const levels=[['Взрослые',2600,55,'Техника дыхания, кроль и спокойное движение в воде.',['Пн 18:00','Ср 19:00','Сб 10:00']],['Дети',2000,40,'Привыкание к воде и первые самостоятельные гребки.',['Вт 16:00','Чт 16:40','Сб 11:30']]],by=id=>document.getElementById(id);let level=0,slot=0;function draw(){let [name,price,min,desc,times]=levels[level];let val=name+' · '+times[slot]+' · '+min+' мин · '+price.toLocaleString('ru-RU')+' ₽';by('summary').textContent=val;by('service').textContent=desc;by('slots').replaceChildren();times.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.setAttribute('aria-pressed',String(i===slot));b.onclick=()=>{slot=i;draw()};by('slots').append(b)});[...by('levels').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(level===i)));by('result').textContent='';}levels.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s[0];b.onclick=()=>{level=i;slot=0;draw()};by('levels').append(b)});by('book').onclick=()=>by('result').textContent='Демо-заявка сформирована: '+by('summary').textContent+'. Тренер увидит выбранный слот в заявке.';by('submit').onclick=()=>{const v=by('review').value.trim();if(!v){by('message').textContent='Сначала напишите отзыв.';return}try{localStorage.setItem('swim-review-demo',v);by('message').textContent='Демо-отзыв сохранён на устройстве со статусом «На модерации».';by('review').value=''}catch{by('message').textContent='Браузер не разрешил локальное сохранение.'}};draw()</script></html>
