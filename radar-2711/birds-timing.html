<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Двое под листом</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#344b3b"><header><b>Кадр / аниматик</b><small>Рабочее демо</small></header><main><section class="intro"><h1>Двое под листом</h1><p>Посмотрите короткую сцену целиком или перейдите к одному из трёх драматургических акцентов.</p></section><section class="grid"><article><h2>Черновая сцена</h2><video id="v" controls playsinline preload="metadata" style="width:100%;border-radius:8px" src="two-birds.mp4"></video></article><div class="panel"><h2>Лист режиссёра</h2><div class="rail" id="cues"></div><p class="call" id="note"></p></div></section></main><footer>Собственный демонстрационный аниматик. Навигация показывает, где согласовывать темп до чистовой анимации.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const cues=[[0,'Завязка','Два героя и один сухой уголок. Дайте зрителю прочитать расстояние между ними.'],[3,'Пауза','Взгляд и пауза до движения раскрывают, что герой заметил соседа.'],[7,'Развязка','Лист смещается. Сцена заканчивается после того, как видно результат поступка.']];cues.forEach(([t,title,msg],i)=>{const b=document.createElement('button');b.textContent=title;b.onclick=()=>{$('v').currentTime=t;$('note').textContent=msg;[...$('cues').children].forEach((v,j)=>v.setAttribute('aria-pressed',j===i));$('v').play().catch(()=>{})};$('cues').append(b)});$('note').textContent=cues[0][2];</script></body></html>
