<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ваш маршрут начинается здесь</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#203c37"><header><b>AÉR / Private Aviation</b><small>Рабочее демо</small></header><main><section class="intro"><h1>Ваш маршрут начинается здесь</h1><p>Интерактивный бриф частного рейса. Сравните сценарии заявки и соберите маршрут для согласования с брокером.</p></section><section class="grid"><div class="panel"><h2>Параметры рейса</h2><div class="rail"><button id="single" aria-pressed="true">В одну сторону</button><button id="round" aria-pressed="false">Туда и обратно</button></div><div class="pair"><label>Откуда<input id="from" value="Москва"></label><label>Куда<input id="to" value="Стамбул"></label></div><div class="pair"><label>Вылет<input id="date" type="date"></label><label id="returnLabel" hidden>Обратно<input id="back" type="date"></label></div><label>Число пассажиров<input type="number" min="1" max="45" id="pax" value="6"></label></div><article aria-live="polite"><h2>Бриф для брокера</h2><div class="metric" id="route"></div><p id="summary"></p><p class="call" id="next"></p><button id="save">Сохранить бриф</button></article></section></main><footer>Демонстрация сценария. Отправка заявки и бронирование борта отключены.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);document.querySelector('.intro').style.background='linear-gradient(90deg,#102923f5,#152b27c9),url(flight-sunset.jpg) center 48% / cover';const tom=new Date();tom.setDate(tom.getDate()+1);const today=new Date();const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('date').min=iso(today);$('date').value=iso(tom);let round=false;function view(){const f=$('from').value.trim(),t=$('to').value.trim(),p=$('pax').valueAsNumber,d=$('date').value,b=$('back').value;$('back').min=d;$('returnLabel').hidden=!round;$('single').setAttribute('aria-pressed',!round);$('round').setAttribute('aria-pressed',round);const ok=f&&t&&f.toLowerCase()!==t.toLowerCase()&&Number.isInteger(p)&&p>=1&&p<=45&&d>=iso(today)&&(!round||b>=d);$('save').disabled=!ok;$('route').textContent=(f||'Откуда')+(round?' ⇄ ':' → ')+(t||'Куда');$('summary').textContent='Вылет '+(d||'—')+(round?' · обратно '+(b||'выберите дату'):'')+' · '+(p||'—')+' пасс.';$('next').textContent=ok?'В запрос войдут маршрут, даты и число мест. Брокер уточнит терминал, багаж и доступность борта.':'Для брифа укажите разные города, количество мест и корректные даты.'}['from','to','date','back','pax'].forEach(id=>$(id).oninput=view);$('round').onclick=()=>{round=true;view()};$('single').onclick=()=>{round=false;view()};$('save').onclick=()=>{const u=URL.createObjectURL(new Blob([$('route').textContent+'\n'+$('summary').textContent],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='Бриф рейса.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};view()</script></body></html>
