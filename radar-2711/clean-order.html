<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рассчитать химчистку</title><link rel="stylesheet" href="practice27.css"><body style="--ink:#26535a"><header><b>Чистая форма / заказ</b><small>Рабочее демо</small></header><main><section class="intro"><h1>Рассчитать химчистку</h1><p>Выберите услугу, укажите площадь или число изделий и получите построчный расчёт.</p></section><section class="grid"><div class="panel"><h2>Параметры расчёта</h2><label>Услуга<select id="model"></select></label><label>Количество единиц по выбранному тарифу<input type="number" id="qty" min="1" max="10000" value="1"></label><div id="opts"></div></div><article aria-live="polite"><h2>Расчёт по строкам</h2><div class="metric" id="total"></div><div id="lineitems"></div><p class="call" id="next"></p><button id="print">Распечатать расчёт</button></article></section></main><footer>Пример интерфейса для сайта химчистки. Тарифы условные.</footer><script>const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);const steps=[["Ковёр · за м²", 450, "При оформлении понадобятся размеры ковра и фото состава."], ["Диванная подушка · за штуку", 750, "Для заказа понадобятся число подушек и материал обивки."], ["Стул · за штуку", 650, "Для подбора способа чистки укажите ткань сиденья."]],opts=[["Забор и возврат партии", 900, false], ["Обработка от запаха за единицу", 160, true]];for(const [i,r] of steps.entries())$('model').add(new Option(r[0],i));for(const [i,r] of opts.entries()){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=i;l.append(c,' '+r[0]);$('opts').append(l)}function draw(){const q=$('qty').valueAsNumber,model=steps[$('model').selectedIndex];$('lineitems').replaceChildren();if(!Number.isInteger(q)||q<1||q>10000){$('total').textContent='Проверьте количество';$('next').textContent='Введите целое число от 1 до 10 000.';return}let sum=0;const append=(s,v)=>{sum+=v;const d=document.createElement('div'),b=document.createElement('b');d.className='tbl';d.textContent=s;b.textContent=fmt(v)+' ₽';d.append(b);$('lineitems').append(d)};append(model[0]+' × '+q,model[1]*q);for(const c of $('opts').querySelectorAll('input:checked')){const r=opts[Number(c.value)];append(r[0],r[1]*(r[2]?q:1))}$('total').textContent=fmt(sum)+' ₽';$('next').textContent=model[2]}document.querySelector('.grid').addEventListener('input',draw);$('print').onclick=()=>window.print();draw();</script></body></html>
