<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дизайн мобильных приложений - портфолио Дианы</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f0;--paper:#fff;--ink:#16161a;--muted:#6b6b76;--line:#e6e2da;--accent:#5b4bff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{height:70px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:Unbounded,sans-serif;font-weight:700;font-size:18px}
.back{font-weight:600;color:var(--accent)}
h1{font-family:Unbounded,sans-serif;font-size:clamp(26px,4vw,42px);line-height:1.15;margin:40px 0 14px}
.lead{color:var(--muted);font-size:17px;max-width:720px;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(1,1fr);gap:18px;margin-bottom:80px}
@media(max-width:800px){.grid{grid-template-columns:repeat(1,1fr)}}
figure{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
figure img{display:block;width:100%;height:auto}
figcaption{padding:10px 14px;font-size:14px;color:var(--muted)}
</style></head><body>
<div class="wrap">
<header><a class="brand" href="/">Диана</a><a class="back" href="/#works">← Все работы</a></header>

<figure><a href="02.jpg" target="_blank"><img src="02.jpg" alt="«Ворсель» - магазин тканей: каталог, калькулятор метража, корзина" loading="lazy" width="1800" height="1138"></a><figcaption>«Ворсель» - магазин тканей: каталог, калькулятор метража, корзина</figcaption></figure>
<figure><a href="03.jpg" target="_blank"><img src="03.jpg" alt="«Ровень» - личные финансы, светлая и тёмная тема" loading="lazy" width="1800" height="924"></a><figcaption>«Ровень» - личные финансы, светлая и тёмная тема</figcaption></figure>
</div></div></body></html>
